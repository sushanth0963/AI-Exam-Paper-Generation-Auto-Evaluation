databases:
  - name: ai-exam-db
    databaseName: ai_exam_prod
    user: ai_exam_user
    plan: free

services:
  - type: web
    name: ai-exam-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-exam-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://ai-exam-paper-generation-auto-evaluation-mjwv.onrender.com
      - key: FRONTEND_URL
        value: https://ai-exam-paper-generation-auto-evaluation-mjwv.onrender.com
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"

  - type: static_site
    name: ai-exam-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://ai-exam-paper-generation-auto-evaluation.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html